name: M1 development verification

on:
  push:
    branches: [master, feature/m1-isolated-development]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  development:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install explicit Android SDK packages
        run: sdkmanager 'cmdline-tools;latest' 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
      - name: Verify isolated development build
        id: verify
        run: |
          run_dir="$(mktemp -d "$RUNNER_TEMP/tvhome-m1-ci.XXXXXXXX")"
          python3 -B scripts/ci-development.py run --output "$run_dir/output" --temp-dir "$RUNNER_TEMP"
      - name: Upload approved development APK and matching evidence
        # APK publication is disabled pending separate activation and a reviewed CI reference.
        if: ${{ false && success() && steps.verify.outputs.apk_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tvhome-development-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-developmentDebug
          path: ${{ steps.verify.outputs.output_dir }}/approved/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics only
        if: ${{ always() && steps.verify.outputs.diagnostics_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tvhome-development-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-developmentDebug
          path: ${{ steps.verify.outputs.reports_dir }}/
          if-no-files-found: error
          retention-days: 14

  production-blocked:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse unconfigured production publication
        run: |
          echo 'M1 is development only. Production identity, certificate pin and release pipeline require a separate reviewed milestone.' >&2
          exit 1

  development-contract:
    # Deliberately not activated by creating an operator variable.
    if: ${{ false && github.repository == 'ordondawid2004-del/glass-tv-custom' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      TVHOME_SIZE_TRUST_ROOT: ${{ vars.TVHOME_SIZE_TRUST_ROOT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source-checkout
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: engine
          ref: ${{ fromJSON(vars.TVHOME_SIZE_TRUST_ROOT).engine_commit }}
          persist-credentials: false
      - name: Verify engine bytes before executing engine code
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, subprocess
          def pairs(items):
              out = {}
              for k, v in items:
                  if k in out: raise ValueError('Duplicate root field')
                  out[k] = v
              return out
          raw = os.environ['TVHOME_SIZE_TRUST_ROOT'].encode()
          if len(raw) > 8192: raise ValueError('Oversized root')
          root = json.loads(raw, object_pairs_hook=pairs)
          expected = {'schema','enabled','repository','repository_id','engine_commit','engine_manifest_sha256','reference_commit','reference_manifest_path','reference_manifest_sha256','policy_id'}
          if set(root) != expected or root['schema'] != 'tvhome.size-trust-root/1': raise ValueError('Invalid root schema')
          if type(root['repository_id']) is not int or root['repository_id'] <= 0: raise ValueError('Invalid fork ID')
          if root['policy_id'] != 'development-no-positive-delta-v1': raise ValueError('Unapproved policy')
          for key, length in [('engine_commit',40),('reference_commit',40),('engine_manifest_sha256',64),('reference_manifest_sha256',64)]:
              if not isinstance(root[key],str) or not re.fullmatch('[0-9a-f]{'+str(length)+'}',root[key]): raise ValueError('Invalid pin')
          if root.get('enabled') is not True or root.get('repository') != 'ordondawid2004-del/glass-tv-custom':
              raise ValueError('No active independent operator root')
          tree = subprocess.check_output(['git', '-C', 'engine', 'ls-tree', '-rz', '--full-tree', 'HEAD'])
          files = []
          for entry in tree.split(b'\0'):
              if not entry: continue
              meta, rel = entry.split(b'\t', 1)
              mode, kind, _ = meta.decode().split()
              if kind != 'blob' or mode not in ('100644', '100755'): raise ValueError('Unsupported engine tree')
              data = (pathlib.Path('engine') / rel.decode()).read_bytes()
              files.append(dict(path=rel.decode(), mode=mode, bytes=len(data), sha256=hashlib.sha256(data).hexdigest()))
          files.sort(key=lambda e: e['path'])
          digest = hashlib.sha256((json.dumps(files, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n').encode()).hexdigest()
          if digest != root['engine_manifest_sha256']: raise ValueError('Untrusted engine bytes')
      - name: Run pinned contract preparation
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then export JAVA_HOME="$JAVA_HOME_21_X64"; fi
          run_dir="$(mktemp -d "$RUNNER_TEMP/tvhome-size.XXXXXXXX")"
          python3 -B engine/scripts/ci-size-gate.py preflight --source source-checkout --output "$run_dir/context.json"
          python3 -B engine/scripts/ci-size-gate.py prepare --context "$run_dir/context.json" --source source-checkout --output "$run_dir/input.json"
          python3 -B engine/scripts/ci-development.py run --project-root "$run_dir/source" --output "$run_dir/output" --temp-dir "$run_dir/private" --size-contract-context "$run_dir/context.json"
    # No upload step: activation needs the separately reviewed toolchain/bootstrap inputs.
